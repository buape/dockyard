name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image:
        description: Image to build, or all
        type: choice
        options: [all, bun, bun_canvas, caddy]
        default: all

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files: ${{ steps.dockerfiles.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select Dockerfiles
        id: dockerfiles
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_IMAGE: ${{ inputs.image }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$REQUESTED_IMAGE" != all ]; then
            printf '%s\n' "images/${REQUESTED_IMAGE}.Dockerfile" > /tmp/dockerfiles
          elif [ "$EVENT_NAME" = push ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$GITHUB_SHA" -- 'images/*.Dockerfile' > /tmp/dockerfiles
          else
            find images -type f -name '*.Dockerfile' > /tmp/dockerfiles
          fi
          if [ ! -s /tmp/dockerfiles ]; then
            find images -type f -name '*.Dockerfile' > /tmp/dockerfiles
          fi
          echo "files=$(jq -R -s -c 'split("\n") | map(select(length > 0))' /tmp/dockerfiles)" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.discover.outputs.files) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          name=$(basename "$DOCKERFILE" .Dockerfile)
          docker buildx build \
            --file "$DOCKERFILE" \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --push \
            --tag "ghcr.io/buape/dockyard-${name}:latest" \
            --tag "ghcr.io/buape/dockyard-${name}:${GITHUB_SHA}" \
            --cache-from "type=gha,scope=${name}" \
            --cache-to "type=gha,mode=max,scope=${name}" \
            .
